# A temporary workflow of the branch msvc-port: the native MSVC build only.
name: MSVC

on:
  push:
    branches: [msvc-port]
  workflow_dispatch:

# A new push cancels the older runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: cmake-build/vs-files
      CONFIG: RelWithDebInfo
    steps:
      - uses: actions/checkout@v4

      - name: Read the LLVM release of cmake/HotLlvmVersion.cmake
        id: llvm
        run: |
          version=$(sed -n 's/^set(HOT_LLVM_VERSION \(.*\))$/\1/p' cmake/HotLlvmVersion.cmake)
          sha=$(grep -oE '[0-9a-f]{64}' cmake/HotLlvmVersion.cmake | head -1)
          name="clang+llvm-${version}-x86_64-pc-windows-msvc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${name}.tar.zst" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: llvm-archive
          key: llvm-windows-msvc-${{ steps.llvm.outputs.sha }}

      - name: Download and unpack the LLVM release for Windows
        run: |
          archive="llvm-archive/${{ steps.llvm.outputs.name }}.tar.zst"
          if [ ! -f "$archive" ]; then
            mkdir -p llvm-archive
            curl -fsSL -o "$archive" "${{ steps.llvm.outputs.url }}"
          fi
          echo "${{ steps.llvm.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p cmake-build
          zstd -d --long=31 -c "$archive" | tar -x -C cmake-build

      # clang++.exe compiles the script modules. It needs link.exe, the UCRT and the MSVC STL.
      # This step loads the environment of the newest Visual Studio (VsDevCmd.bat) for the next
      # steps. Each "set" line has one variable, so no value has more than one line.
      - name: Load the Visual Studio environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.+)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }

      - name: Configure
        run: |
          cmake --preset vs-files -DHOT_DOWNLOAD_LLVM=OFF -DHOT_LLVM_RELEASES_DIR="$(pwd -W)/cmake-build" \
            -DHOT_BUILD_TRANSLATOR=ON -DHOT_BUILD_TESTS=ON -DHOT_BUILD_SAMPLES=OFF

      # The build goes in stages, so one run shows the state of each stage. A failed stage is red,
      # and the next stages still run.
      - name: Build hotc
        id: hotc
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --config "$CONFIG" --target hotc --parallel

      - name: Build the runtime and the language server
        id: runtime
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --config "$CONFIG" --target hot_runtime hot_backend hot_ls --parallel

      - name: Build all
        id: all
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --config "$CONFIG" --parallel

      - name: Test
        if: always() && steps.hotc.outcome == 'success'
        run: ctest --test-dir "$BUILD_DIR" -C "$CONFIG" -j 4 --timeout 300 --output-on-failure
