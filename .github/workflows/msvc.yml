# A temporary workflow of the branch msvc-port: the native MSVC build only.
name: MSVC

on:
  push:
    branches: [msvc-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows-msvc
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: cmake-build/vs-files
      CONFIG: RelWithDebInfo
    steps:
      - uses: actions/checkout@v4

      - name: Read the LLVM release of cmake/HotLlvmVersion.cmake
        id: llvm
        run: |
          version=$(sed -n 's/^set(HOT_LLVM_VERSION \(.*\))$/\1/p' cmake/HotLlvmVersion.cmake)
          sha=$(grep -oE '[0-9a-f]{64}' cmake/HotLlvmVersion.cmake | head -1)
          name="clang+llvm-${version}-x86_64-pc-windows-msvc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${name}.tar.zst" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: llvm-archive
          key: llvm-windows-msvc-${{ steps.llvm.outputs.sha }}

      - name: Download and unpack the LLVM release for Windows
        run: |
          archive="llvm-archive/${{ steps.llvm.outputs.name }}.tar.zst"
          if [ ! -f "$archive" ]; then
            mkdir -p llvm-archive
            curl -fsSL -o "$archive" "${{ steps.llvm.outputs.url }}"
          fi
          echo "${{ steps.llvm.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p cmake-build
          zstd -d --long=31 -c "$archive" | tar -x -C cmake-build
          ls "cmake-build/${{ steps.llvm.outputs.name }}/bin" | head -5

      # clang++.exe compiles the script modules. It needs link.exe, the UCRT and the MSVC STL.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          cmake --preset vs-files -DHOT_DOWNLOAD_LLVM=OFF -DHOT_LLVM_RELEASES_DIR="$(pwd -W)/cmake-build" \
            -DHOT_BUILD_TRANSLATOR=ON -DHOT_BUILD_TESTS=ON -DHOT_BUILD_SAMPLES=OFF

      # Each build step writes a log and shows the distinct errors. A failed step does not stop
      # the next steps, so one run shows each stage.
      - name: Build hotc
        continue-on-error: true
        run: |
          rc=0; cmake --build "$BUILD_DIR" --config "$CONFIG" --target hotc --parallel > build-hotc.log 2>&1 || rc=$?
          grep -E "error|fatal" build-hotc.log | sed -E 's/\[[A-Z]:[^]]*\]//' | cut -c1-300 | sort | uniq -c | sort -rn | head -60 || true
          exit $rc

      - name: Build the runtime
        continue-on-error: true
        run: |
          rc=0; cmake --build "$BUILD_DIR" --config "$CONFIG" --target hot_runtime hot_backend hot_ls --parallel > build-runtime.log 2>&1 || rc=$?
          grep -E "error|fatal" build-runtime.log | sed -E 's/\[[A-Z]:[^]]*\]//' | cut -c1-300 | sort | uniq -c | sort -rn | head -60 || true
          exit $rc

      - name: Build all
        continue-on-error: true
        run: |
          rc=0; cmake --build "$BUILD_DIR" --config "$CONFIG" --parallel -- -p:ContinueOnError=true > build-all.log 2>&1 || rc=$?
          grep -E "error|fatal" build-all.log | sed -E 's/\[[A-Z]:[^]]*\]//' | cut -c1-300 | sort | uniq -c | sort -rn | head -150 || true
          exit $rc

      - name: Test
        if: always()
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR -C $env:CONFIG -j 4 --timeout 300 --output-log ctest.log 2>&1 | Select-String -Pattern 'tests passed|Failed|\*\*\*|Timeout|Not Run' | Select-Object -Last 300
          Select-String -Path ctest.log -Pattern '^\[  FAILED  \]|error|Failure|Expected|Which is|Value of' | Select-Object -First 300 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(250, $_.Line.Length)) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msvc-logs
          path: |
            build-*.log
            ctest.log
          if-no-files-found: ignore
