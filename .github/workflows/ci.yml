# The CI of Hot++. It builds and tests on Linux, it makes the SDKs for Linux and Windows, and it
# tests each SDK on a clean runner. A push to master then puts the SDKs in the release "latest".
#
# Jobs:
#   linux              Build and test on Linux with the files backend only (no JIT). Make
#                      hotpp-sdk-linux-x86_64.tar.gz.
#   build-linux        Build the test build of Linux once, with both backends. Upload the build tree.
#   test-linux         Download the build tree. Two jobs run in parallel: files, jit.
#   aot-linux          Build and test the whole suite in an AOT build. Two jobs run in parallel: aot,
#                      aot-optimized.
#   windows-msvc       Build and test on Windows with MSVC (files backend only). Make
#                      hotpp-sdk-windows-x86_64.zip.
#   build-windows      Build the test build of Windows once, with both backends. Upload the build tree.
#   test-windows       Download the build tree. Two jobs run in parallel: files, jit.
#   aot-windows        Build and test the whole suite in an AOT build with MSVC. Two jobs run in
#                      parallel: aot, aot-optimized.
#   sdk-smoke-linux    Unpack the Linux SDK on a clean Ubuntu 24.04 runner. Run tests/sdk_smoke/run.cmake.
#   sdk-smoke-windows  Unpack the Windows SDK on a clean Windows runner. Run the same script with MSVC.
#   release            Push to master only. Move the tag "latest" and replace the release assets.
#
# The tests run in three configurations: both backends (build-linux, test-linux, build-windows and
# test-windows), the files backend only (linux and windows-msvc) and AOT (aot-linux and
# aot-windows).
#
# Each SDK comes from a second build with HOT_PORTABLE=ON and HOT_BUILD_TESTS=OFF. Such a build
# has no build paths in the binaries (CMakeLists.txt). The tests need the build paths, so the
# test build is a different build.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new run cancels the older run of the same pull request or of the same branch that is not
# master. A run of master never cancels an other run: the older run can be in its release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # The LLVM major version of the Linux build. apt.llvm.org gives the packages. The Clang package
  # and libclang must have the same major version. The major version is in three places. Change
  # them together: this line, HOT_LLVM_VERSION in cmake/HotLlvmVersion.cmake (the LLVM release
  # of the Windows build) and the package names in doc/download.md.
  LLVM_VERSION: "23"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM, Clang and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${LLVM_VERSION} clangd-${LLVM_VERSION} libclang-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-dev ninja-build
          # The presets use "clang" and "clang++". This folder has them for the pinned version.
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          echo "CPM_SOURCE_CACHE=$HOME/.cache/cpm" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/cpm
          key: cpm-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-linux-

      - name: Configure
        run: cmake --preset linux-clang-files

      - name: Build
        run: cmake --build --preset linux-clang-files-rel

      # All tests run. No test is excluded: the Linux suite is fast in parallel. The tests that
      # need a tool get it here: node (VscodeGrammar and the other editor tests) comes with the
      # runner, and clangd comes from apt. The packaging of the VS Code extension needs vsce. The
      # runner has no vsce, so the build skips that part. This build has the files backend only:
      # it is the test of a build without the JIT backend. The files backend is the default here.
      - name: Test
        run: ctest --preset linux-clang-files-rel -j "$(nproc)"

      - name: Build the SDK (portable)
        run: |
          cmake --preset linux-clang-files -B cmake-build/sdk -DCMAKE_CONFIGURATION_TYPES=Release \
            -DHOT_PORTABLE=ON -DHOT_BUILD_TESTS=OFF -DHOT_BUILD_SAMPLES=OFF
          cmake --build cmake-build/sdk --config Release

      - name: Package the SDK
        run: |
          mkdir -p dist stage
          cmake --install cmake-build/sdk --config Release --prefix stage/hotpp-sdk-linux-x86_64
          # hotc must link the libclang of the system: the SDK does not have it.
          ldd stage/hotpp-sdk-linux-x86_64/bin/hotc
          case "$(ldd stage/hotpp-sdk-linux-x86_64/bin/hotc)" in *libclang*) ;; *) echo "hotc does not link libclang"; exit 1 ;; esac
          tar -C stage -czf dist/hotpp-sdk-linux-x86_64.tar.gz hotpp-sdk-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: hotpp-sdk-linux-x86_64
          path: dist/hotpp-sdk-linux-x86_64.tar.gz
          if-no-files-found: error

  # The test build is one build with both run-time backends (the preset linux-clang-both). The
  # job builds all targets once. The job test-linux uses the build tree of this job. The tests
  # keep the absolute paths of the build tree, so the test jobs use the same path (the checkout
  # of the same repository on the same runner image). tar keeps the file modes and the symbolic
  # links. The tree goes in the archive whole: the tests need the executables, the libraries,
  # the generated files and the CMake files, and some tests use the build tree again.
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM, Clang and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${LLVM_VERSION} clangd-${LLVM_VERSION} libclang-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-dev ninja-build
          # The presets use "clang" and "clang++". This folder has them for the pinned version.
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          echo "CPM_SOURCE_CACHE=$HOME/.cache/cpm" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/cpm
          key: cpm-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-linux-

      - name: Configure
        run: cmake --preset linux-clang-both

      - name: Build
        run: cmake --build --preset linux-clang-both-rel

      - name: Pack the build tree
        run: tar -C cmake-build -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/linux-clang-both.tar.zst" linux-clang-both

      # The archive is compressed, so the upload does not compress it again.
      - uses: actions/upload-artifact@v7
        with:
          name: build-linux-clang-both
          path: ${{ runner.temp }}/linux-clang-both.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Each backend has its own runner, so the two test runs are parallel. Each job runs ctest on
  # the build of build-linux. The jobs files and jit run the full suite, with the run-time
  # backend (HOT_BACKEND). The job aot-linux runs the AOT builds.
  # No test is excluded: the Linux suite is fast in parallel. The tools for the tests are the
  # same as in the job linux (node comes with the runner, clangd comes from apt). The jobs files
  # and jit run clang and LLVM at run time, so all jobs install them.
  test-linux:
    name: test-linux (${{ matrix.name }})
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: files
            backend: files
          - name: jit
            backend: jit
    env:
      HOT_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM, Clang and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${LLVM_VERSION} clangd-${LLVM_VERSION} libclang-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-dev ninja-build
          # The presets use "clang" and "clang++". This folder has them for the pinned version.
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          echo "CPM_SOURCE_CACHE=$HOME/.cache/cpm" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/cpm
          key: cpm-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-linux-

      - uses: actions/download-artifact@v8
        with:
          name: build-linux-clang-both
          path: ${{ runner.temp }}/artifact

      - name: Unpack the build tree
        run: |
          mkdir -p cmake-build
          tar -C cmake-build -I 'zstd -d' -xf "$RUNNER_TEMP/artifact/linux-clang-both.tar.zst"

      - name: Test
        run: ctest --preset linux-clang-both-rel -j "$(nproc)"

  # The AOT test builds on Linux. The job builds and runs the whole suite in a separate AOT build
  # (the preset linux-clang-aot or linux-clang-aot-opt). The macros __HOTPP_AOT__ and
  # __HOTPP_RELOAD__ compile out the tests that need the reload. Each AOT build runs the
  # parity test. Some cases are only for the optimized variant. The steps are the steps of the job linux. The matrix runs in
  # parallel, so each AOT variant has its own status.
  aot-linux:
    name: aot-linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aot
            preset: linux-clang-aot
          - name: aot-optimized
            preset: linux-clang-aot-opt
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM, Clang and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${LLVM_VERSION} clangd-${LLVM_VERSION} libclang-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-dev ninja-build
          # The presets use "clang" and "clang++". This folder has them for the pinned version.
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          echo "CPM_SOURCE_CACHE=$HOME/.cache/cpm" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/cpm
          key: cpm-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-linux-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-rel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-rel -j "$(nproc)"

  # The native Windows build with MSVC (the preset vs-files). cl.exe builds hotc, the runtime and
  # the tests. clang++.exe of the LLVM release compiles the script modules. Some tests do not run
  # or skip on MSVC today. These are known gaps. Later steps remove them.
  #   - The JIT tests are not built (the preset vs-files has HOT_ENABLE_JIT=OFF).
  #   - The lldb session tests of tests/unit/python/CMakeLists.txt are off (MSVC).
  #   - The DebugInfo tests skip (the modules have CodeView, and llvm-dwarfdump reads DWARF).
  #   - The AotLink symbol checks read the PDB with llvm-pdbutil. They never ran on MSVC.
  # The runner windows-2022 has Visual Studio 2022 (toolset v143). The static libraries of the SDK
  # then link with Visual Studio 2022 and with each newer toolset. sdk-smoke-windows runs on a
  # newer Visual Studio (windows-latest), so it tests this rule.
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 90
    # sdk-smoke-windows runs when the SDK package step succeeds, also when a test fails.
    outputs:
      sdk: ${{ steps.package.outcome }}
      msvc: ${{ steps.msvc.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: cmake-build/vs-files
      CONFIG: RelWithDebInfo
    steps:
      - uses: actions/checkout@v7

      - name: Read the LLVM release of cmake/HotLlvmVersion.cmake
        id: llvm
        run: |
          version=$(sed -n 's/^set(HOT_LLVM_VERSION \(.*\))$/\1/p' cmake/HotLlvmVersion.cmake)
          sha=$(grep -oE '[0-9a-f]{64}' cmake/HotLlvmVersion.cmake | head -1)
          name="clang+llvm-${version}-x86_64-pc-windows-msvc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${name}.tar.zst" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: llvm-archive
          key: llvm-windows-msvc-${{ steps.llvm.outputs.sha }}

      - name: Download and unpack the LLVM release for Windows
        run: |
          archive="llvm-archive/${{ steps.llvm.outputs.name }}.tar.zst"
          if [ ! -f "$archive" ]; then
            mkdir -p llvm-archive
            curl -fsSL -o "$archive" "${{ steps.llvm.outputs.url }}"
          fi
          echo "${{ steps.llvm.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p cmake-build
          zstd -d --long=31 -c "$archive" | tar -x -C cmake-build

      # clang++.exe compiles the script modules. It needs link.exe, the UCRT and the MSVC STL.
      # This step loads the environment of the newest Visual Studio (VsDevCmd.bat) for the next
      # steps. Each "set" line has one variable, so no value has more than one line.
      - name: Load the Visual Studio environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.+)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }

      # The tools of the LLVM release (clangd, llvm-nm, llvm-pdbutil, llvm-dwarfdump) go on PATH.
      # This step is after VsDevCmd. The runner puts the path in front of PATH, and the bin folder
      # has no cl.exe and no link.exe, so the MSVC tools still win. Steps that use the release by
      # explicit path are not changed. GITHUB_PATH needs a Windows path, so the step uses pwd -W.
      - name: Add the LLVM tools to PATH
        run: echo "$(pwd -W)/cmake-build/${{ steps.llvm.outputs.name }}/bin" >> "$GITHUB_PATH"

      # The step only prints. A missing tool does not hide the other tools.
      - name: Print the versions of the tools
        continue-on-error: true
        run: |
          for cmd in "clangd --version" "node --version" "llvm-nm --version" "llvm-pdbutil --help" \
                     "llvm-dwarfdump --version" "llvm-readobj --version"; do
            echo "::group::$cmd"
            { $cmd 2>&1 | head -n 5; } || echo "FAILED: $cmd"
            echo "::endgroup::"
          done
          echo "::group::where.exe lldb"
          where.exe lldb 2>&1 || echo "lldb not found"
          echo "::endgroup::"

      # The release notes name this toolset. The static libraries of the SDK need the same MSVC
      # toolset or a newer one in the consumer.
      - name: Record the MSVC toolset
        id: msvc
        run: echo "version=Visual Studio $VisualStudioVersion, MSVC toolset $VCToolsVersion" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake --preset vs-files -DHOT_DOWNLOAD_LLVM=OFF -DHOT_LLVM_RELEASES_DIR="$(pwd -W)/cmake-build" \
            -DHOT_BUILD_TRANSLATOR=ON -DHOT_BUILD_TESTS=ON -DHOT_BUILD_SAMPLES=OFF

      # The build goes in stages, so one run shows the state of each stage. A failed stage is red,
      # and the next stages still run.
      - name: Build hotc
        id: hotc
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --config "$CONFIG" --target hotc --parallel

      - name: Build the runtime and the language server
        id: runtime
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --config "$CONFIG" --target hot_runtime hot_backend hot_ls --parallel

      - name: Build all
        id: all
        continue-on-error: true
        run: cmake --build "$BUILD_DIR" --config "$CONFIG" --parallel

      # The step has a time limit, so the job ends and its log is available.
      - name: Test
        if: ${{ !cancelled() && steps.hotc.outcome == 'success' }}
        timeout-minutes: 40
        run: ctest --preset vs-files-rel -j "$NUMBER_OF_PROCESSORS"

      # The test build is large. Remove it before the SDK build, so the disk does not become full.
      - name: Remove the test build
        if: ${{ !cancelled() }}
        run: rm -rf "$BUILD_DIR"

      # The SDK is a Release build with the DLL C++ runtime (/MD). A consumer builds in Release
      # or RelWithDebInfo. A Debug consumer (/MDd) cannot link the static libraries of the SDK.
      - name: Build the SDK (portable)
        id: sdk
        if: ${{ !cancelled() }}
        run: |
          cmake --preset vs-files -B cmake-build/sdk -DCMAKE_CONFIGURATION_TYPES=Release \
            -DHOT_DOWNLOAD_LLVM=OFF -DHOT_LLVM_RELEASES_DIR="$(pwd -W)/cmake-build" \
            -DHOT_BUILD_TRANSLATOR=ON -DHOT_PORTABLE=ON -DHOT_BUILD_TESTS=OFF -DHOT_BUILD_SAMPLES=OFF
          cmake --build cmake-build/sdk --config Release --parallel

      # hotc.exe and hot-ls.exe need only libclang.dll and the MSVC runtime of the system. The
      # install puts libclang.dll in bin/ and the Clang headers in lib/clang/<major>/include.
      - name: Package the SDK
        id: package
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          mkdir -p dist stage
          cmake --install cmake-build/sdk --config Release --prefix stage/hotpp-sdk-windows-x86_64
          test -f stage/hotpp-sdk-windows-x86_64/bin/libclang.dll
          ls -d stage/hotpp-sdk-windows-x86_64/lib/clang/*/include
          cd stage && cmake -E tar cf ../dist/hotpp-sdk-windows-x86_64.zip --format=zip hotpp-sdk-windows-x86_64

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: hotpp-sdk-windows-x86_64
          path: dist/hotpp-sdk-windows-x86_64.zip
          if-no-files-found: error

  # The test build of Windows has both run-time backends (the preset vs-both), like build-linux.
  # The job builds all targets once. The job test-windows uses the build tree of this job. The
  # build tree has absolute paths (the CMake cache and the LLVM release folder cmake-build), so the
  # test jobs unpack the tree to the same path: the checkout of the same repository on the same
  # runner image. The JIT backend needs zlib and zstd. The component libraries of the LLVM release
  # link them (the release has no clang-cpp). The release has /MD Release libraries only, so only
  # RelWithDebInfo builds.
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the LLVM release of cmake/HotLlvmVersion.cmake
        id: llvm
        run: |
          version=$(sed -n 's/^set(HOT_LLVM_VERSION \(.*\))$/\1/p' cmake/HotLlvmVersion.cmake)
          sha=$(grep -oE '[0-9a-f]{64}' cmake/HotLlvmVersion.cmake | head -1)
          name="clang+llvm-${version}-x86_64-pc-windows-msvc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${name}.tar.zst" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: llvm-archive
          key: llvm-windows-msvc-${{ steps.llvm.outputs.sha }}

      - name: Download and unpack the LLVM release for Windows
        run: |
          archive="llvm-archive/${{ steps.llvm.outputs.name }}.tar.zst"
          if [ ! -f "$archive" ]; then
            mkdir -p llvm-archive
            curl -fsSL -o "$archive" "${{ steps.llvm.outputs.url }}"
          fi
          echo "${{ steps.llvm.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p cmake-build
          zstd -d --long=31 -c "$archive" | tar -x -C cmake-build

      # The static libraries zlib and zstd with the DLL C++ runtime (/MD). The LLVM libraries of
      # the release link them.
      - name: Install zlib and zstd
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib zstd --triplet x64-windows-static-md
          DEPS_PREFIX="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md"
          echo "DEPS_PREFIX=$DEPS_PREFIX" >> "$GITHUB_ENV"
          ls "$DEPS_PREFIX/lib"

      - name: Load the Visual Studio environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.+)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }

      # This step is after VsDevCmd, so the MSVC tools still win over the LLVM tools.
      - name: Add the LLVM tools to PATH
        run: echo "$(pwd -W)/cmake-build/${{ steps.llvm.outputs.name }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --preset vs-both -DHOT_DOWNLOAD_LLVM=OFF -DHOT_LLVM_RELEASES_DIR="$(pwd -W)/cmake-build" \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
            -DHOT_BUILD_TRANSLATOR=ON -DHOT_BUILD_TESTS=ON -DHOT_BUILD_SAMPLES=OFF

      - name: Build
        run: cmake --build --preset vs-both-rel --parallel

      # GNU tar reads "D:" in a file name as a host name, so the step gives tar the path in the
      # Unix form (cygpath -u).
      - name: Pack the build tree
        run: |
          archive="$(cygpath -u "$RUNNER_TEMP")/vs-both.tar.zst"
          tar -C cmake-build -I 'zstd -T0 -3' -cf "$archive" vs-both

      # The archive is compressed, so the upload does not compress it again.
      - uses: actions/upload-artifact@v7
        with:
          name: build-windows-vs-both
          path: ${{ runner.temp }}/vs-both.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Each backend has its own runner, so the two test runs are parallel. Each job runs ctest on the
  # build of build-windows, with the run-time backend (HOT_BACKEND). The jobs follow the matrix of
  # test-linux. The tests use the LLVM release by its path (HOT_LLVM_RELEASES_DIR in the cache of
  # the build tree) and clang++.exe needs link.exe, the UCRT and the MSVC STL. So each job gets the
  # LLVM release and the Visual Studio environment as build-windows does. The release folder is
  # not in the archive. The step checkout gives the sources at the same path as in build-windows.
  # The preset vs-both-rel has the configuration RelWithDebInfo, so ctest needs no -C option.
  test-windows:
    name: test-windows (${{ matrix.backend }})
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [files, jit]
    defaults:
      run:
        shell: bash
    env:
      HOT_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the LLVM release of cmake/HotLlvmVersion.cmake
        id: llvm
        run: |
          version=$(sed -n 's/^set(HOT_LLVM_VERSION \(.*\))$/\1/p' cmake/HotLlvmVersion.cmake)
          sha=$(grep -oE '[0-9a-f]{64}' cmake/HotLlvmVersion.cmake | head -1)
          name="clang+llvm-${version}-x86_64-pc-windows-msvc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${name}.tar.zst" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: llvm-archive
          key: llvm-windows-msvc-${{ steps.llvm.outputs.sha }}

      - name: Download and unpack the LLVM release for Windows
        run: |
          archive="llvm-archive/${{ steps.llvm.outputs.name }}.tar.zst"
          if [ ! -f "$archive" ]; then
            mkdir -p llvm-archive
            curl -fsSL -o "$archive" "${{ steps.llvm.outputs.url }}"
          fi
          echo "${{ steps.llvm.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p cmake-build
          zstd -d --long=31 -c "$archive" | tar -x -C cmake-build

      - name: Load the Visual Studio environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.+)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }

      # This step is after VsDevCmd, so the MSVC tools still win over the LLVM tools.
      - name: Add the LLVM tools to PATH
        run: echo "$(pwd -W)/cmake-build/${{ steps.llvm.outputs.name }}/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: build-windows-vs-both
          path: ${{ runner.temp }}/artifact

      - name: Unpack the build tree
        run: |
          archive="$(cygpath -u "$RUNNER_TEMP")/artifact/vs-both.tar.zst"
          mkdir -p cmake-build
          tar -C cmake-build -I 'zstd -d' -xf "$archive"

      - name: Test
        timeout-minutes: 40
        run: ctest --preset vs-both-rel -j "$NUMBER_OF_PROCESSORS"

  # The AOT test builds on Windows. The job builds and runs the whole suite in a separate AOT
  # build (the preset vs-aot or vs-aot-opt). The two presets inherit vs-files: they need no JIT,
  # no zlib and no zstd. The steps are the steps of windows-msvc without the SDK.
  aot-windows:
    name: aot-windows (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aot
            preset: vs-aot
          - name: aot-optimized
            preset: vs-aot-opt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the LLVM release of cmake/HotLlvmVersion.cmake
        id: llvm
        run: |
          version=$(sed -n 's/^set(HOT_LLVM_VERSION \(.*\))$/\1/p' cmake/HotLlvmVersion.cmake)
          sha=$(grep -oE '[0-9a-f]{64}' cmake/HotLlvmVersion.cmake | head -1)
          name="clang+llvm-${version}-x86_64-pc-windows-msvc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/${name}.tar.zst" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: llvm-archive
          key: llvm-windows-msvc-${{ steps.llvm.outputs.sha }}

      - name: Download and unpack the LLVM release for Windows
        run: |
          archive="llvm-archive/${{ steps.llvm.outputs.name }}.tar.zst"
          if [ ! -f "$archive" ]; then
            mkdir -p llvm-archive
            curl -fsSL -o "$archive" "${{ steps.llvm.outputs.url }}"
          fi
          echo "${{ steps.llvm.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p cmake-build
          zstd -d --long=31 -c "$archive" | tar -x -C cmake-build

      - name: Load the Visual Studio environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.+)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }

      # This step is after VsDevCmd, so the MSVC tools still win over the LLVM tools.
      - name: Add the LLVM tools to PATH
        run: echo "$(pwd -W)/cmake-build/${{ steps.llvm.outputs.name }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} -DHOT_DOWNLOAD_LLVM=OFF -DHOT_LLVM_RELEASES_DIR="$(pwd -W)/cmake-build" \
            -DHOT_BUILD_TRANSLATOR=ON -DHOT_BUILD_TESTS=ON -DHOT_BUILD_SAMPLES=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-rel --parallel

      - name: Test
        timeout-minutes: 40
        run: ctest --preset ${{ matrix.preset }}-rel -j "$NUMBER_OF_PROCESSORS"

  # The smoke tests run without the source tree and without the build. The sparse checkout
  # gives only tests/sdk_smoke.
  sdk-smoke-linux:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/sdk_smoke
          sparse-checkout-cone-mode: false

      # The Linux SDK needs the libclang of its build and a C++ compiler.
      - name: Install Clang, libclang and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${LLVM_VERSION} libclang-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-dev ninja-build

      - uses: actions/download-artifact@v8
        with:
          name: hotpp-sdk-linux-x86_64
          path: ${{ runner.temp }}/artifact

      - name: Unpack the SDK into an empty folder
        run: |
          mkdir "$RUNNER_TEMP/sdk"
          tar -C "$RUNNER_TEMP/sdk" -xzf "$RUNNER_TEMP/artifact/hotpp-sdk-linux-x86_64.tar.gz"

      - name: Run the SDK smoke test
        run: |
          cmake -DSDK="$RUNNER_TEMP/sdk" -DWORK_DIR="$RUNNER_TEMP/smoke" \
            -DCXX_COMPILER=clang++-${LLVM_VERSION} -P tests/sdk_smoke/run.cmake

  # The Windows SDK on a clean Windows runner. The consumer uses MSVC and the default generator
  # (the newest Visual Studio). The Visual Studio generator finds cl.exe itself, so the job does
  # not load the Visual Studio environment.
  sdk-smoke-windows:
    needs: windows-msvc
    if: ${{ !cancelled() && needs.windows-msvc.outputs.sdk == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/sdk_smoke
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: hotpp-sdk-windows-x86_64
          path: ${{ runner.temp }}/artifact

      - name: Unpack the SDK into an empty folder
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP")
          mkdir "$temp/sdk"
          cd "$temp/sdk" && cmake -E tar xf "$temp/artifact/hotpp-sdk-windows-x86_64.zip"

      - name: Run the SDK smoke test
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP")
          cmake -DSDK="$temp/sdk" -DWORK_DIR="$temp/smoke" -DGENERATOR=default -P tests/sdk_smoke/run.cmake

  # The release "latest" follows master. Only a push to master updates it. The workflow group
  # does not cancel a run of master. The group "release-latest" lets one release job run at a
  # time, and a new job does not cancel the job in progress. A job that is not for the head of
  # master does not release (the step below).
  release:
    needs: [linux, test-linux, aot-linux, windows-msvc, test-windows, aot-windows, sdk-smoke-linux, sdk-smoke-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-latest
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A newer push can move master while this run is in progress. Then this run does not
      # release, so the release never goes back to an older commit.
      - name: Check that this commit is the head of master
        id: head
        run: |
          remote=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$remote" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "master is at $remote, this run is for $GITHUB_SHA. No release."
          fi

      - name: Move the tag latest to this commit
        if: steps.head.outputs.current == 'true'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      # Each new file goes up under a temporary name first. Then the step deletes the old asset
      # and renames the new one to the final name. Thus a download finds the old file or the new
      # file, and the time with no file is short. The step also deletes the assets with other names.
      - name: Update the release latest
        if: steps.head.outputs.current == 'true'
        env:
          MSVC: ${{ needs.windows-msvc.outputs.msvc }}
        run: |
          notes=$(printf 'The latest build of master.\n\nCommit: %s\n\nThe toolset of the Windows SDK: %s. A consumer needs this MSVC toolset or a newer one.\n' "$GITHUB_SHA" "$MSVC")
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$notes" --prerelease
          else
            gh release create latest --title "Latest build" --notes "$notes" --prerelease --verify-tag
          fi
          finals="hotpp-sdk-linux-x86_64.tar.gz hotpp-sdk-windows-x86_64.zip"
          mkdir -p upload
          for final in $finals; do
            temp="new-${GITHUB_RUN_ID}-${final}"
            cp "dist/$final" "upload/$temp"
            gh release upload latest "upload/$temp" --clobber
            old_id=$(gh api "repos/{owner}/{repo}/releases/tags/latest" --jq ".assets[] | select(.name == \"$final\") | .id")
            if [ -n "$old_id" ]; then
              gh api -X DELETE "repos/{owner}/{repo}/releases/assets/$old_id"
            fi
            new_id=$(gh api "repos/{owner}/{repo}/releases/tags/latest" --jq ".assets[] | select(.name == \"$temp\") | .id")
            gh api -X PATCH "repos/{owner}/{repo}/releases/assets/$new_id" -f name="$final" > /dev/null
          done
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            case " $finals " in
              *" $asset "*) ;;
              *) gh release delete-asset latest "$asset" --yes ;;
            esac
          done
