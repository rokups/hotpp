<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<nav class="side">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <ul>
  {% assign pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
  {% for p in pages %}
    <li{% if p.url == page.url %} class="active"{% endif %}><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
  {% endfor %}
  </ul>
</nav>
<main>
  <h1>{{ page.title }}</h1>
  {{ content }}
</main>
</body>
</html>
